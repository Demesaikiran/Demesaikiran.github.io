<html>
<head>
    <link href="img/favicon.png" rel="icon">
    <link href="img/apple-touch-icon.png" rel="apple-touch-icon">
    <title>Demesaikiran's Interactive Terminal</title>
    <style>
        body { background:#000; color:#fff; font-family:monospace; }
        #console { white-space:pre-wrap; font-size:20px; color:#fff; }
        #prompt-line { display:flex; align-items:center; font-size:20px; }
        input#cmd { flex:1; border:none; background:transparent; color:#fff; outline:none; font-family:monospace; font-size:20px; }
        .prompt { color:#0f0; font-size:20px; margin-right:8px; }
        .prompt:before { content:'demesaikiran@root:~$'; }
        .company { color:#0bc; }
        a { color:#0bc; text-decoration:none; }
    </style>
</head>
<body>
    <div id="console"></div>
    <div id="prompt-line"><span class="prompt"></span><input id="cmd" autofocus autocomplete="off" spellcheck="false" /></div>

    <script>
        const terminal = document.getElementById('console');
        const input = document.getElementById('cmd');
        const promptLine = document.getElementById('prompt-line');

        const commands = {
          help: 'Available commands:\n├─ help\n├─ about\n├─ education\n├─ experience\n├─ contact\n├─ resume\n└─ clear',
          about: 'Hi, I\'m Deme Sai Kiran – Associate Staff Engineer at Samsung Semiconductor India Research (SSIR).',
          education: 'M.Tech in Computer Science and Engineering, <span class="company">University of Hyderabad</span>.',
          experience: '2023/08 – Present | Bengaluru, India\nAssociate Staff Engineer – <span class="company">Samsung Semiconductor India Research</span>\n  ├─ Driver development & optimization for flagship camera sensors.\n  ├─ Supported testing/validation, used ADB, Imatest, Chromatix.\n  ├─ Worked on Qualcomm AP firmware (SM8450/SM8550/SM8650).\n  ├─ Post‑Si validation of CMOS sensors; IQ verification for HPE(200MP),\n  │  JN3/5(50MP), HP3(200MP).\n  └─ Built Python/Qt desktop app and automation scripts cutting validation\n     time from a week to one day.\n\n2025/10 – 2026/01 | South Korea\nAssociate Staff Engineer – <span class="company">Samsung Electronics DSR Korea</span>\n  └─ Onsite ownership of commercial sensor troubleshooting; drove driver\n     development improvements.\n\n2022/06 – 2023/07 | Hyderabad, India\nRobotics Engineer (Intern) – <span class="company">Institutions of Eminence</span>\n  ├─ Simulated and deployed robotic arm with MuJoCo on NVIDIA Jetson.\n  ├─ Built face‑tracking arm using servos, camera; validated in MuJoCo.\n  └─ Worked with Raspberry Pi, Jetson, SC09A, L298N, IMX519 cameras.\n\n2022/01 – 2022/08 | Hyderabad, India\nProduct Development Engineer 1 – <span class="company">Phenom</span>\n  ├─ Generated search metrics reports migrating MongoDB→SNOWFLAKE;\n  │  replaced 10‑20 functions with one, aiding thousands of clients.\n  └─ Created Airflow DAGs and resolved analytics‑airflow issues.\n\n2019/01 – 2019/06 | Pune, India\nTechnologist – <span class="company">Spotle.ai</span>\n\nTotal professional experience: <span class="company"><strong>~7 years</strong></span> (since Jan 2019).',
          contact: 'Contact information:\n├─ Email: <a href="mailto:demesaikiran@gmail.com">demesaikiran@gmail.com</a>\n├─ Phone: +91-8074832059\n└─ LinkedIn: <a href="https://www.linkedin.com/in/demesaikiran" target="_blank">https://www.linkedin.com/in/demesaikiran</a>',
          resume: '<a href="https://drive.google.com/file/d/1Xd_xE5K-aZgUXeSfjllms0XQY_ZDUUaW/view?usp=sharing" target="_blank">Download resume</a>',
        };

        function appendLine(text = '') {
          const line = document.createElement('div');
          line.innerHTML = text.replace(/\n/g, '<br>');
          terminal.appendChild(line);
          window.scrollTo(0, document.body.scrollHeight);
        }

        function handleInput(e) {
          if (e.key === 'Enter') {
            const raw = input.value.trim();
            const cmd = raw.toLowerCase();
            // show prompt and user command separately (preserve case)
            appendLine(`<span class="prompt"></span><span class="cmd-text">${raw}</span>`);
            if (cmd === 'clear') {
              terminal.innerHTML = '';
            } else {
              appendLine(commands[cmd] || `bash: ${raw}: command not found`);
            }
            input.value = '';
          }
        }

        input.addEventListener('keydown', handleInput);
        // focus input whenever user clicks anywhere on the page
        document.body.addEventListener('click', () => input.focus());
        appendLine('Type "help" to see available commands.');
        // extra style for command text
        const style = document.createElement('style');
        style.textContent = '#console .cmd-text { color:#fff; }';
        document.head.appendChild(style);
    </script>
</body>
</html>
